[package]
name = "aetherbond-core"
version = "0.1.0"
edition = "2021"
authors = ["AetherBond Lead Architect"]
description = "Commercial-grade high-performance multipath data plane and bonding VPN engine"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
quinn = "0.10"
ring = "0.17"
bytes = "1.5"
futures-util = "0.3"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam = "0.8"
rand = "0.8"
aya = { version = "0.11", optional = true } # For Linux eBPF/XDP kernel acceleration

[features]
default = []
xdp = ["dep:aya"] # Optional Linux eBPF/XDP bypass feature flag
