[package]
name = "aetherbond-gui"
version = "1.0.0"
description = "AetherBond Multipath Aggregator GUI"
authors = ["AetherBond Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }

[features]
# by default tauri runs in custom protocols
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
