apiVersion: v1
kind: Service
metadata:
  name: {{ include "aetherbond-relay.fullname" . }}
  labels:
    {{- include "aetherbond-relay.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      name: aetherbond-udp
    - port: 9100
      targetPort: 9100
      protocol: TCP
      name: prometheus-metrics
  selector:
    {{- include "aetherbond-relay.selectorLabels" . | nindent 4 }}
